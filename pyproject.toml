[project]
name = "test-mcp"
version = "0.1.0"
description = "MCP server for GCOOS HF radar radial data (hfr.gcoos.org/data)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3.0",
]

[project.scripts]
test-mcp = "test_mcp:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
